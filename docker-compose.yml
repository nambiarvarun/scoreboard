version: "3.7"
services:
  api_service:
    build: .
    restart: always
    ports:
      - 8080:8080
    networks:
      - springapimysql-net
    environment:
      - spring.datasource.url=jdbc:mysql://127.0.0.1:3306/scoreboard
    depends_on:
      - mysqldb

    volumes:
      - .m2:/root/.m2

  mysqldb:
    image: "mysql:8.0"
    restart: always
    ports:
      - 3306:3306
    networks:
        - springapimysql-net
    environment:
      MYSQL_DATABASE: scoreboard
      MYSQL_USER: root
      MYSQL_PASSWORD: nambnutsdb
        -MYSQL_ROOT_PASSWORD=some_password
networks:
  springapimysql-net: